name: Test FastSD CPU

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Image description"
        required: true
        type: string
        default: "A full-body samurai warrior standing upright, wearing traditional Japanese armor and holding one katana sword. Minimalist black ink illustration, pure white background, bold recognizable shapes, no text."
      negative_prompt:
        description: "Elements to avoid"
        required: false
        type: string
        default: "blurry, distorted anatomy, extra limbs, duplicate objects, text, watermark"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out test repository
        uses: actions/checkout@v4

      - name: Check out FastSD CPU
        uses: actions/checkout@v4
        with:
          repository: rupeshs/fastsdcpu
          ref: main
          path: fastsdcpu

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip uv

      - name: Create environment
        working-directory: fastsdcpu
        run: |
          uv venv --python 3.11 env

      - name: Install CPU-only PyTorch
        working-directory: fastsdcpu
        run: |
          source env/bin/activate
          uv pip install torch==2.8.0 torchvision==0.23.0 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        working-directory: fastsdcpu
        run: |
          source env/bin/activate
          grep -v '^PyQt5' requirements.txt > /tmp/fastsd-requirements.txt
          uv pip install -r /tmp/fastsd-requirements.txt

      - name: Generate image
        working-directory: fastsdcpu
        env:
          IMAGE_PROMPT: ${{ inputs.prompt }}
          NEGATIVE_PROMPT: ${{ inputs.negative_prompt }}
        run: |
          source env/bin/activate

          # Fix Python imports for modules located in src/
          export PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}"

          python - <<'PY'
          import os
          from pathlib import Path

          from state import get_context, get_settings
          from models.interface_types import InterfaceType
          from backend.models.lcmdiffusion_setting import DiffusionTask

          app_settings = get_settings()
          config = app_settings.settings

          # Model
          config.lcm_diffusion_setting.lcm_model_id = "stabilityai/sd-turbo"

          # Prompts
          config.lcm_diffusion_setting.prompt = os.environ["IMAGE_PROMPT"]
          config.lcm_diffusion_setting.negative_prompt = os.environ["NEGATIVE_PROMPT"]

          # Image dimensions
          config.lcm_diffusion_setting.image_width = 512
          config.lcm_diffusion_setting.image_height = 512

          # Fast generation settings
          config.lcm_diffusion_setting.inference_steps = 1
          config.lcm_diffusion_setting.guidance_scale = 1.0

          # Reproducibility
          config.lcm_diffusion_setting.seed = 42
          config.lcm_diffusion_setting.use_seed = True

          # CPU configuration
          config.lcm_diffusion_setting.use_openvino = False

          # Disable optional components
          config.lcm_diffusion_setting.use_lcm_lora = False
          config.lcm_diffusion_setting.use_tiny_auto_encoder = False
          config.lcm_diffusion_setting.use_safety_checker = False
          config.lcm_diffusion_setting.controlnet = None
          config.lcm_diffusion_setting.lora.enabled = False

          # Task
          config.lcm_diffusion_setting.diffusion_task = (
              DiffusionTask.text_to_image.value
          )

          # Output
          config.generated_images.path = "results"
          config.generated_images.format = "PNG"
          config.generated_images.save_image = True

          Path(config.generated_images.path).mkdir(
              parents=True, exist_ok=True
          )

          # Generate on CPU
          context = get_context(InterfaceType.CLI)

          images = context.generate_text_to_image(
              settings=config,
              device="cpu",
              save_config=False,
          )

          if not images:
              raise RuntimeError("FastSD CPU returned no images.")

          saved_files = context.save_images(images, config)

          if not saved_files:
              raise RuntimeError(
                  "FastSD CPU generated no saved image files."
              )

          for filename in saved_files:
              path = Path(config.generated_images.path) / filename
              print(f"Saved image: {path.resolve()}")
          PY

      - name: Verify output
        run: |
          test -n "$(find fastsdcpu/results -type f \
            \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) \
            -print -quit)"

      - name: Upload generated image
        uses: actions/upload-artifact@v4
        with:
          name: fastsd-cpu-test-image
          path: fastsdcpu/results/
          if-no-files-found: error
