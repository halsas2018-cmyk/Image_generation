
name: Test FastSD CPU

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Image description"
        required: true
        type: string
        default: "A full-body samurai warrior standing upright, wearing traditional Japanese armor and holding one katana sword. Minimalist black ink illustration, pure white background, bold recognizable shapes, no text."
      negative_prompt:
        description: "Elements to avoid"
        required: false
        type: string
        default: "blurry, distorted anatomy, extra limbs, duplicate objects, text, watermark"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out test repository
        uses: actions/checkout@v4

      - name: Check out FastSD CPU
        uses: actions/checkout@v4
        with:
          repository: rupeshs/fastsdcpu
          ref: main
          path: fastsdcpu

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Create environment
        working-directory: fastsdcpu
        run: uv venv --python 3.11 env

      - name: Install CPU-only PyTorch
        working-directory: fastsdcpu
        run: |
          source env/bin/activate
          uv pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        working-directory: fastsdcpu
        run: |
          source env/bin/activate
          grep -v '^PyQt5' requirements.txt > /tmp/fastsd-requirements.txt
          uv pip install -r /tmp/fastsd-requirements.txt

      - name: Generate image
        working-directory: fastsdcpu
        env:
          IMAGE_PROMPT: ${{ inputs.prompt }}
          NEGATIVE_PROMPT: ${{ inputs.negative_prompt }}
        run: |
          source env/bin/activate
          python src/app.py \
            --prompt "$IMAGE_PROMPT" \
            --negative_prompt "$NEGATIVE_PROMPT" \
            --image_width 512 \
            --image_height 512 \
            --inference_steps 1 \
            --guidance_scale 1.0 \
            --seed 42 \
            --number_of_images 1

      - name: Verify output
        run: |
          test -n "$(find fastsdcpu/results -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -print -quit)"

      - name: Upload generated image
        uses: actions/upload-artifact@v4
        with:
          name: fastsd-cpu-test-image
          path: fastsdcpu/results/
          if-no-files-found: error
