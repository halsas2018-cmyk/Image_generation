
name: Test Line-Art Image Model

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            torch==2.5.1 \
            --index-url https://download.pytorch.org/whl/cpu

          python -m pip install \
            diffusers==0.32.2 \
            transformers==4.46.3 \
            accelerate==1.1.1 \
            peft==0.13.2 \
            safetensors

      - name: Generate test image
        run: python scripts/generate_lineart.py

      - name: Upload generated image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lineart-test-image
          path: sketch.png
          if-no-files-found: warn
          retention-days: 7
          
